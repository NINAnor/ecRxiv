name: PR review checklist (for admin)
description: For Admin only - A checklist for processing new PRs (submissions)
title: '[New PR]: "indicatorID"' 
labels: PR-checklist
assignees: anders-kolstad
body:
  - type: markdown
    attributes:
      value: |
        This form is to be filled out by an ecRxiv approved reviewer. Guidence material can be found on our [wiki page](https://github.com/NINAnor/ecRxiv/wiki/Admin#pr-review-checklist).
  - type: input
    id: prid
    attributes:
      label: PR number
      description: Link to the PR
      placeholder: "#123"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: I confirm that I read and will adhere to the [code of conduct](https://github.com/NINAnor/ecRxiv/blob/main/docs/code_of_conduct.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: checkboxes
    id: coi
    attributes:
      label: Conflict of Interest
      description: I confirm that I have **no** conflict of interest that makes me unsuited to review this indicator. 
      options:
        - label: I confirm that I have **no** conflict of interest
          required: false
  - type: input
    id: coi_comment
    attributes:
      label: comment
      description: Explain any conflict of interest      
    validations:
      required: false
  - type: checkboxes
    id: landing
    attributes:
      label: Change base branch
      description: |
        PRs should be made to the _submission_ branch, 
        but in order to keep that branch clean, 
        we edit the PR so that it goes to a new branch.
        Start by creating a new branch from template. 
        Name it _submission-INDICATORID_,
        where you replace INDICATORID with the actual ID.
        Then open the PR and click edit.
        This is the little pencil symbol directly after the PR title.
        It looks like it there just to change the title, 
        but it also allows you to change the base branch from a dropdown menu.
        Change the base branch to submission-INDICATORID.
      options:
        - label: PR updated with new base branch 
          required: false
  - type: checkboxes
    id: id
    attributes:
      label: Indicator ID 
      description: You can read about the naming convention on the wiki page.
      options:
        - label: The indicator has an ID that follows the naming convention
        - label: The PR is labeled with the indicator ID
  - type: checkboxes
    id: modfiles
    attributes:
      label: Modified files
      description: |
        Are there are no unreasonably big files or too many files 
        (e.g. html_files, old drafts or cashed files folders). 
        Are any non-relevant files included? 
      options:
        - label: The number of new files is correct
          required: false
  - type: checkboxes
    id: meta
    attributes:
      label: Metadata
      description: Check each term carefully. Is the type of uncertainty correctly stated? Is the aggregation pathway reported correctly? 
      options:
        - label: |
            The top yaml is fillout correctly with all the metadata.
          required: false
  - type: input
    id: meta_comment
    attributes: 
      description: Comment
  - type: checkboxes
    id: permissions
    attributes:
      label: Data permissions
      description: |
        Do the authors have permission to use the data; is the data properly cited, and; 
        in case the data is not openly available - do the authors describe how it can be accessed?
      options:
        - label: Data permission in order
          required: false
  - type: checkboxes
    id: str
    attributes:
      label: File structure
      description: |
        look at the quarto file and check that the document structure 
        (headers etc.) is more or less according to the template.
      options:
        - label: File structure is OK
          required: false
  - type: checkboxes
    id: refs
    attributes:
      label: Bibliography
      description: |
        Check that in-text citations included in a reference list, alternatively as hyperlinks. 
      options:
        - label: References are in order
          required: false
  - type: checkboxes
    id: html
    attributes:
      label: HTML
      description: |
        The HTML is included and looks good. To view it, open the html 
        from the PR and view it by pasting this string to the start of the URL: 
        `http://htmlpreview.github.io/?`. You can also open the html from your IDE after you have cloned the PR (see next step). 
      options:
        - label: HTML is OK
          required: false        
  - type: checkboxes
    id: render
    attributes:
      label: Render
      description: |
        ecRxiv needs to be able to render the .qmd locally for typesetting purposes. 
        This is required, even if we don't have access to all the data that the full workflow uses. 
        Parts of the workflow that use external data therefore needs to be bypassed, or cached, 
        so that the .qmd can still render. Start by cloning the PR with this command:
        `git fetch origin pull/ID/head:BRANCH_NAME`, where `ID` is the ID for the 
        PR which you can see in the PR's title following a hash tag. It's usually 
        a three or four digit number. `BRANCH_NAME` you can make up yourself. 
        A suggestion is to use the indicator ID followed by `code-review`.
        Then switch to that branch: `git switch BRANCH_NAME`. Now try to render the .qmd file. 
      options:
        - label: The quarto file renders locally
          required: false        
  - type: checkboxes
    id: issues
    attributes:
      label: Check existing issues
      description: |
        Search within open and closed issues for the indicator ID and verify that they have been addressed, 
        i.e. that the authors have replied with a comment to the issues.
      options:
        - label: Existing issues adequately addressed
          required: false         
  - type: checkboxes
    id: review
    attributes:
      label: Code review (optoinal)
      description: |
        A more comprehensive code review can be done at this stage, 
        depending on the project and the requests from the authors. 
        **With code review we mean a review of the text and code, 
        besides that which pertains to meta data and technical requirement for rendering the HTML.** 
        Instead we are talking about the analysis part of the workflow, 
        including code added as code chunks, as well as the textual part of the documentation. 
        Go to the PR to start a review. You can make general comments, 
        or specific comments referring to specific lines of code. 
        
        You may need to start a similar review of the PR for addressing deficiencies 
        retaining to some of the earier points in the checklist, 
        but you should not check this box unless you have done a code review, defined as we have here.  

        See the wiki page for how to to add reviewer information to the top YAML.
      options:
        - label: Code review started and completed
        - label: Code reviewer credited in the top YAML and the final HTML, or lack of code review disclosed
  - type: checkboxes
    id: after
    attributes:
      label: After acceptance - typesetting
      description: |
        After the PR is accepted you can merge the PR into the 
        submission-INDICATORID branch. Then you put all the relevant 
        files into a folder named after the indicator ID(s).
      options:
        - label: PR merged into `submission-INDICATORID`
        - label: New branch created from `submission-INDICATORID`, named `typesetting-INDICATORID`
        - label: check that the log and all dates in the metadata parts are updated
        - label: check that all the badges render nicely and that the open science badges are correct
        - label: check that the summary has correct line breaks. There should be no paragraphs within a subheader, and no blank line under the sub headers.
        - label: suppress unneccessary output messages or warning in the HTML (optional)
        - label: tables are OK, i.e. scrollable if needed and not extreamly long or wide.
        - label: Add a README following the current structure of the READMEs used on ecRxiv.
        - label: Open PR from `typesetting-INDICATORID` to `submission-INDICATORID` and label it with the INDICATORID
        - label: Branch `typesetting-INDICATORID` merged into `submission-INDICATORID`
        - label: New branch created from `main`, called `upload-INDICATORID`.
        - label: Add the neccessary files to this branch, in a folder called `indicators/INDICATORID`. 
        - label: Create a stable HTML under `R/`.  See the wiki page for help. 
        - label: Open a PR from `upload-INDICATORID` to `main`.
        - label: Label this PR with INDICATORID.
        - label: Merge `upload-INDICATORID` into `main`.
               
